[build]
  publish = "site"

# Consolidate the explicit index URL with the canonical homepage.
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

# The site moved to its own domain — send the old Netlify address to it
# so the two addresses do not compete as duplicates in search engines.
[[redirects]]
  from = "http://consultingwebsite-marian.netlify.app/*"
  to = "https://mariankrotov.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://consultingwebsite-marian.netlify.app/*"
  to = "https://mariankrotov.com/:splat"
  status = 301
  force = true

# Security headers. HSTS is already sent by Netlify
# (strict-transport-security: max-age=31536000).
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    # Allow same-origin framing and Yandex Metrika/Webvisor review frames.
    # CSP frame-ancestors supports the required domain exceptions; X-Frame-Options does not.
    Content-Security-Policy = "frame-ancestors 'self' https://metrika.yandex.ru https://metrika.yandex.by https://metrica.yandex.com https://metrica.yandex.com.tr https://webvisor.com https://*.webvisor.com"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
